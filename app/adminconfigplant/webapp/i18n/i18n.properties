# ============================================================
# [ORDER-COMPLETE] Completed Plex job -> user status on the SAP order (feature 0045, W1-12).
# "Production orders" tab, fourth section. The opposite direction of the technical close above.
# ============================================================
cmpGroupTitle=Job completed on Plex \u2192 user status in SAP
cmpNotConfigured=Plant {0} has no completed-jobs configuration: when the lot is finished on the shop floor, nothing shows in SAP. State which Plex statuses mean "finished" and save.
cmpLblEnabled=Write the user status in SAP
cmpHelpEnabled=When off, the completion is only DETECTED and recorded as pending: nothing is written to SAP. Once you turn it on, the backlog goes out by itself on the first run \u2014 nothing is lost in the meantime. This checkbox is the only switch: there is no system-wide lever above it, so once on the job writes to real orders from the very first run.
cmpLblStatuses=Plex statuses that mean "finished"
cmpPhStatuses=Type a status and press Enter
cmpHelpStatuses=It is enough for the Plex job to be in ONE of these. Usually it is Completed. There is NO list to pick from because job statuses are a setup table of your Plex tenant, not of the product: type them as you see them in Plex. A typo produces no error \u2014 it produces zero orders processed. The run recap lists the statuses it actually saw, and that is where you find out.
cmpHelpEmpty=With the switch on, at least one status is required: without a criterion nothing would ever be declared, and the configuration would look active while doing nothing.
cmpBtnSave=Save
cmpBtnCancel=Cancel
cmpSaved=Completed-jobs configuration saved for plant {0}. It applies from the next run.
cmpSaveError=Error saving the completed-jobs configuration: {0}
cmpNoStatuses=With writing to SAP enabled, at least one Plex status is required: without a criterion no order would ever be declared, and the configuration would look active while doing nothing.
