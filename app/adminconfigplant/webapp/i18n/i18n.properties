schedPlantMandatory=Plant is mandatory
schedPlantFormat=Plant must be 1-4 uppercase alphanumeric characters
schedStatusesMandatory=With writing to SAP enabled, at least one Plex status is required: without a criterion no order would ever be declared, and the configuration would look active while doing nothing.
schedListTooLong=The list exceeds {0} characters
