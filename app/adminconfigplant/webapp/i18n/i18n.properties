# "Routings" and "Prod Orders" tabs. One row, one Save.
# ============================================================
phxTabIntro=A phantom assembly is a BOM grouping that does not exist in production: it is never picked and never consumed. When explosion is on, a phantom component is replaced by its own BOM components; if one of those is a phantom too, the same happens again. These parameters are shared by every object; the switches that turn explosion on are in the Routings and Prod Orders tabs.
