plantRoleUnknown=Your role on plant {0} could not be verified (the license server did not answer): the operation is not allowed. Retry in a few minutes.

# ---- UNIQUE CONSTRAINTS (server-side, last-resort net) ----
# [UNIQUE-VIOLATION] @assert.unique is compile-time only: it generates a database index, not a
# handler, so a violation used to surface as a raw HANA 500. The before-handlers cannot be the only
# defence - CAP dispatches the sub-requests of a $batch change set in PARALLEL, so two identical
# rows saved together never see each other. See srv/lib/uniqueConstraintError.js.
# Placeholder key: no apostrophes (MessageFormat).
uniqueConstraintViolation=A row with these values already exists: {0}. Each combination can be present only once.

