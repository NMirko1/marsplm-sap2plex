phxGroupRouting=Phantom explosion in routing components
phxGroupProdOrder=Phantom explosion in production order components
phxNotConfigured=Plant {0} has no explosion configured: phantom components are sent to Plex as they come from SAP, exactly as before. Set the values below and save to configure it.
phxLblMaxDepth=Maximum explosion depth
phxHelpMaxDepth=How many phantom levels to walk through, from 1 to 20. A BOM deeper than this is almost always a loop; beyond the cap the phantom is left as it is and the run is flagged.
phxLblBomUsage=BOM usage (STLAN)
phxHelpBomUsage=Which BOM usage to pick for a phantom. Leave it empty for no constraint.
phxLblBomVariant=Alternative BOM (STLAL)
phxHelpBomVariant=Which alternative to pick. Leave it empty to take the lowest one available.
phxAnyPlaceholder=any
phxLblDateMode=Explosion date
phxHelpDateMode=Which date the BOM validity is read at. The order start date only applies to production orders; routings always use today.
phxDateToday=Today
phxDateOrderStart=Production order start date
# [ROUTING-COMP-SOURCE] Routing BOM key date (feature 0025)
phxLblKeyDate=Routing BOM key date
phxKeyDatePlaceholder=empty: only the cycle components
phxHelpKeyDate=Only used by the scheduled routing job, and only if it is set. On top of the components SAP has attached to the routing operations, the job reads the header material BOM at this date and adds whatever is missing, placing it with the object group rules. Set it far in the future (e.g. 31/12/2500) so that any component an engineering change will bring into the BOM already shows up today. Leave it empty to keep the previous behaviour: the cycle components only.
phxLblInRouting=Explode phantoms in routing components
phxHelpInRouting=Off, the routing component tree stays exactly as SAP returns it. On, every phantom is replaced by its components, in the cockpit tree, in manual auto-assignment and in the scheduled routing job that writes the BOM to Plex.
phxLblInProdOrder=Explode phantoms in production order components
phxHelpInProdOrder=Off, the order component tree stays exactly as SAP returns it. On, every phantom is replaced by its components, in the cockpit tree, in manual auto-assignment, in the scheduled job and in order splitting. Note: SAP usually dissolves phantoms already when the order is created, so the visible effect is often just the phantom row disappearing, with no new component added.
phxHelpSharedSave=These settings and the two switches in the Routings and Prod Orders tabs are one single record: saving from any of the three tabs persists all of them.
phxBtnSave=Save
phxBtnCancel=Discard
phxSaved=Phantom explosion configuration saved for plant {0}. It takes effect from the next read; routings and orders already sent are not reprocessed.
phxSaveError=Error saving the phantom explosion configuration: {0}
