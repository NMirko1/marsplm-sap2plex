# [W1-01] Catch-all category - "everything else = raw material" (BBP GENGA 2.0 \u00a77.3.4).
mcColCatchAll=Catch-all category
mcCatchAllTag=Catch-all: takes every remaining material
mcCatchAllHint=A catch-all category takes every material that no other category of this plant matches, and assigns it the Plex part type selected above. It has no conditions, and its sequence is not used: it is always evaluated last. At most one active catch-all per plant.
