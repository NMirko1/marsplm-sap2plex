completePlantMandatory=Plant is mandatory
completePlantFormat=Plant must be 1-4 uppercase alphanumeric characters
completeStatusesMandatory=With writing to SAP enabled, at least one Plex status is required: without a criterion no order would ever be declared, and the configuration would look active while doing nothing.
completeListTooLong=The list exceeds {0} characters
completeDuplicate=Plant {0} already has a completed-jobs configuration

# ============================================================
# [ORDER-SCHEDULED] Scheduled Plex job -> user status on the SAP order (feature 0046, W1-11).
# "Production orders" tab, fifth section. Twin of the fourth, on the other end of the cycle.
# ============================================================
schGroupTitle=Job scheduled on Plex \u2192 user status in SAP
schNotConfigured=Plant {0} has no scheduled-jobs configuration: when a lot is scheduled in Plex, nothing shows in SAP. State which Plex statuses mean "scheduled" and save.
schLblEnabled=Write the user status in SAP
schHelpEnabled=When off, detection still runs and the job stays recorded as pending: nothing is written to SAP. Once you turn it on, the backlog goes out by itself on the first run \u2014 nothing is lost in the meantime. This checkbox is the only switch: there is no system-wide lever above it, so once on the job writes to real orders from the very first run.
schLblStatuses=Plex statuses that mean "scheduled"
schPhStatuses=Type a status and press Enter
schHelpStatuses=It is enough for the Plex job to be in ONE of these. Usually it is Scheduled. There is NO list to pick from because job statuses are a setup table of your Plex tenant, not of the product: type them as you see them in Plex. A typo produces no error \u2014 it produces zero orders processed. The run recap lists the statuses it actually saw, and that is where you find out.
schHelpSnapshot=The job looks at the statuses AS THEY ARE NOW, not at the changes that happened: if a lot enters and leaves "Scheduled" between two runs, that transition is not seen. To avoid missing it you can also list the later statuses (for example Sequenced), at the price of declaring "scheduled" an order that is already past that.
schHelpEmpty=With the switch on, at least one status is required: without a criterion nothing would ever be declared, and the configuration would look active while doing nothing.
schBtnSave=Save
schBtnCancel=Cancel
schSaved=Scheduled-jobs configuration saved for plant {0}. It applies from the next run.
schSaveError=Error saving the scheduled-jobs configuration: {0}
schNoStatuses=With writing to SAP enabled, at least one Plex status is required: without a criterion no order would ever be declared, and the configuration would look active while doing nothing.
