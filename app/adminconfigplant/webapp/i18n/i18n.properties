# ============================================================
# [CONF-POSTING] Feature 0028 \u2014 Consumi e scarti della consuntivazione, per plant
# ============================================================
tabConfPosting=Consuntivazione
cpcTabIntro=What the production records coming back from Plex become in SAP: WHEN the components are consumed, and what happens to them when a piece is SCRAPPED. With no configuration, or with the default values, the behaviour is exactly the one in place before this screen existed.
cpcNotConfigured=Plant {0} has no configuration: components are consumed only at the goods-receipt operation and the whole BOM is consumed, a scrap posts only the finished product, and a scrap without a production job is not recorded. To change any of these, save this form.
# [CONF-POSTING] Feature 0030 \u2014 which channel carries production into SAP.
cpcGroupChannel=Production posting channel
cpcLblProdPosting=Production goes to SAP as
cpcProdPostingMATDOC=Our material documents (261 + 101)
cpcProdPostingCONF=An order confirmation (SAP does the movements)
cpcHelpProdPosting=The first option is what happens today and stays the default: we post the component consumption and the goods receipt ourselves. With the second one we post ONE order confirmation and SAP does the movements \u2014 automatic goods receipt from the control key, backflush of the components \u2014 so our two production documents no longer go out. The confirmation is sent only at the LAST operation of the order's Plex cycle; a record on an intermediate operation is archived and says so. SCRAP is a material document in both cases: the confirmation cannot express it without posting it on top of ours.
cpcLblConfPostEnabled=Post the confirmation
cpcConfPostEnabledText=Send order confirmations to SAP
cpcHelpConfPostEnabled=Off, the confirmation rows are still BUILT and simply wait: the day this is switched on the backlog goes out by itself. This is NOT the material-document test flag on the plant: a confirmation has no test mode \u2014 SAP either posts it or it does not, and the only way back is a reversal in CO13 \u2014 so switching it on is a separate decision. It is the only switch: no environment variable can override this checkbox.
cpcGroupProduct=Good product
cpcGroupScrap=Scrap
cpcGroupSapValues=Values passed to SAP
cpcLblConsumeAt=Component consumption
cpcConsumeAtLAST=Only at the goods-receipt operation (whole BOM)
cpcConsumeAtEACH_OP=At every confirmed operation (its own components)
cpcHelpConsumeAt=BBP 8.3.3 asks for the first option, which is the default. The second one consumes, at each confirmed operation, the components that the PLEX TREE of the order hangs from that operation; the goods receipt of the product still happens only at the goods-receipt operation, because a product is received once. With the second option a component that the tree never placed is never consumed, and that fact is declared.
cpcLblScrapConsume=Components on a scrap
cpcScrapConsumeNONE=None: only the product moves
cpcScrapConsumeUP_TO_OP=Up to the scrap operation (whole BOM at the last one)
cpcScrapConsumeALL=The whole BOM
cpcHelpScrapConsume=BBP 8.4.1 asks for the CONSUMPTION of the components, and the middle option has two arms: on an intermediate operation the components from that operation back to the first, at the goods-receipt operation the whole BOM. The reference quantity is always the SCRAPPED one. Which operation a component belongs to is decided by the PLEX TREE of the order, not by the SAP reservation: if that tree has no component assigned to an operation, the scrap is held back and declared instead of consuming the whole BOM.
cpcLblScrapMove=Component posting
cpcScrapMoveISSUE=261 with order reference (cost stays on the order)
cpcScrapMoveSCRAP=551 with order reference (cost leaves the order)
cpcHelpScrapMove=This chooses the posting, not whether to consume: that is the field above. The cost centre and the movement reason are not configured here \u2014 the ABAP side derives them from the order and its operations.
cpcLblScrapIssue=Product movement
cpcScrapIssueALWAYS=At any operation
cpcScrapIssueGR_OP_ONLY=Only at the goods-receipt operation
cpcHelpScrapIssue=BBP 8.5.2 states that intermediate WIP is not received into SAP, so on an intermediate operation there is no stock of the finished product to issue: the movement is either rejected or it takes good pieces from other orders. The second option is the safe one; the first is what happened before this screen existed.
cpcLblScrapNoOrder=Scrap of an already-received piece
cpcScrapNoOrderOFF=Not recorded (declared in the job recap)
cpcScrapNoOrderPOST=551 without order reference
cpcHelpScrapNoOrder=Plex records this scrap without a production job, so there is no SAP order: the components have already been charged by the goods receipt, and only the product is issued. The material is resolved from the Plex part dictionary; the storage location below is mandatory, because there is no order header to take it from.
cpcLblStorLoc=Storage location (LGORT_FROM)
cpcHelpStorLoc=Where the scrap is issued from. Empty means "as before", i.e. the storage location on the order header.
cpcLblReason=Movement reason (MOVE_REAS)
cpcHelpReason=Four digits, leading zeros added on save: typing 13 saves 0013. Empty means no reason is sent.
cpcLblHeadTxt=Material document header text
cpcHelpHeadTxt=A fixed, recognisable string in MB51; the Plex job number is appended while the 25 characters allow it. Empty means the text composed as before.
cpcLblLateTxt=Item text for a scrap without a job
cpcHelpLateTxt=This is how the scrap of an already-received piece is told apart in SAP: a text, not a different posting. Only used when the field above is set to post.
cpcBtnSave=Save
cpcBtnCancel=Cancel
cpcSaved=Consumption and scrap settings saved for plant {0}. They apply from the next run of the PROD_CONF job; records already posted are not reprocessed.
cpcSaveError=Save failed: {0}
# Server-side validation (srv/cat-service.js and srv/lib/confPostingRules.js), read at runtime.
cpcPlantMandatory=Plant is mandatory
cpcPlantFormat=Plant must be 1 to 4 uppercase letters or digits
cpcDuplicate=Plant {0} already has a consumption and scrap configuration: there can be only one row per plant
cpcModeInvalid=Value not allowed: pick one of {0}
cpcDoubleCharge=Consuming at every operation AND consuming the components again on a scrap charges them twice: a scrapped piece has already consumed what it went through. Either consume only at the goods-receipt operation, or leave the scrap components on "None".
cpcStorLocRequired=A scrap without a production job has no order header, so the storage location cannot be derived: fill it in
cpcLateTxtUnused=This text is only used when the scrap of an already-received piece is posted: either enable it, or clear the text
cpcEachOpNotWithConf=With an order confirmation the consumption point says WHERE to confirm, and "at every confirmed operation" would mean several final confirmations on the same order, i.e. several times the confirmed quantity. Set the consumption point to "Only at the goods-receipt operation", or go back to material documents.
cpcConfEnabledWithoutConf=Posting the confirmation is switched on while production goes to SAP as material documents: no confirmation would ever be sent. Either pick the confirmation channel, or switch this off.
# The three settings that reproduce the rule stated by the customer, in one place.
cpcRecipe=The rule agreed for Ariston: at the LAST operation a 551 of the header material plus a 261 on the whole BOM; on an INTERMEDIATE operation only a 261 on the components from that Plex operation back to the first, and no 551 at all. Set: components on a scrap = "Up to the scrap operation", product movement = "Only at the goods-receipt operation", component posting = "261 with order reference".

