sessionExpiredTitle=Session expired
sessionExpiredDirty=Your session expired while you were working. Your changes are still on screen and have NOT been saved. Reconnect, then press Save again.
sessionExpiredClean=Your session expired because of inactivity. Reconnect to carry on.
sessionReconnect=Reconnect
sessionReload=Reload
