# ============================================================
# [PHANTOM-EXPLODE] Feature 0019 - esplosione dei componenti fantasma (per plant)
# I parametri del motore stanno nella scheda "Distinta base"; i due interruttori per oggetto
# nelle schede "Cicli di lavorazione" e "Ordini di produzione". Una riga sola, un Salva solo.
#
# ATTENZIONE AGLI APOSTROFI: le chiavi con segnaposto (phxNotConfigured, phxSaved,
# phxSaveError, phxDepthRange, phxDateModeInvalid, phxDuplicate) passano da MessageFormat \u2014
# lato client via getText(key, args), lato server via getLocalizedMessage \u2014 e un apostrofo
# singolo mangerebbe il segnaposto. Sono scritte SENZA apostrofi, come le osf* della 0017.
# ============================================================
phxTabIntro=Un assieme fantasma \u00e8 un raggruppamento di distinta che in produzione non esiste: non si preleva e non si consuma. Con l'esplosione attiva, un componente fantasma viene sostituito dai suoi componenti di distinta; se uno di questi \u00e8 a sua volta fantasma, l'operazione si ripete. Questi parametri valgono per tutti gli oggetti; gli interruttori che accendono l'esplosione stanno nelle schede Cicli di lavorazione e Ordini di produzione.
phxGroupEngine=Motore di esplosione dei fantasma
phxGroupRouting=Esplosione dei fantasma nei componenti dei cicli
phxGroupProdOrder=Esplosione dei fantasma nei componenti degli ordini
phxNotConfigured=Il plant {0} non ha una configurazione di esplosione: i componenti fantasma vengono inviati a Plex come arrivano da SAP, esattamente come prima. Imposta i valori qui sotto e salva per configurarla.
phxLblMaxDepth=Profondit\u00e0 massima di esplosione
phxHelpMaxDepth=Quanti livelli di fantasma attraversare, da 1 a 20. Una distinta pi\u00f9 profonda di cos\u00ec \u00e8 quasi sempre un anello; oltre il tetto il fantasma resta com'\u00e8 e l'esecuzione va in attenzione.
phxLblBomUsage=Utilizzo distinta (STLAN)
phxHelpBomUsage=Quale utilizzo distinta scegliere per un fantasma. Lascialo vuoto per non porre vincoli.
phxLblBomVariant=Alternativa distinta (STLAL)
phxHelpBomVariant=Quale alternativa scegliere. Lascialo vuoto per prendere la pi\u00f9 bassa fra quelle esistenti.
phxAnyPlaceholder=qualunque
phxLblDateMode=Data di esplosione
phxHelpDateMode=A quale data si legge la validit\u00e0 della distinta. La data di inizio ordine vale solo per gli ordini di produzione; i cicli usano sempre oggi.
phxDateToday=Oggi
phxDateOrderStart=Data di inizio dell'ordine di produzione
# [ROUTING-COMP-SOURCE] Data di riferimento della distinta per i cicli (feature 0025)
phxLblKeyDate=Data di riferimento della distinta (cicli)
phxKeyDatePlaceholder=vuota: solo i componenti del ciclo
phxHelpKeyDate=La usa il solo job pianificato dei cicli, e solo se \u00e8 impostata. Oltre ai componenti che in SAP sono agganciati alle operazioni del ciclo, il job legge la distinta del materiale di testata a questa data e aggiunge quello che manca, collocandolo con le regole dei gruppi oggetto. Va messa molto avanti nel tempo (per esempio 31/12/2500), cos\u00ec che qualunque componente che una modifica tecnica far\u00e0 entrare in distinta risulti gi\u00e0 oggi. Lasciandola vuota resta il comportamento di prima: i soli componenti del ciclo.
phxLblInRouting=Esplodi i fantasma nei componenti dei cicli
phxHelpInRouting=Spento, l'albero dei componenti del ciclo resta esattamente quello che SAP restituisce. Acceso, ogni fantasma viene sostituito dai suoi componenti: nell'albero del cockpit, nell'auto-assegnazione manuale e nel job pianificato dei cicli, che \u00e8 quello che scrive la distinta su Plex.
phxLblInProdOrder=Esplodi i fantasma nei componenti degli ordini
phxHelpInProdOrder=Spento, l'albero dei componenti dell'ordine resta esattamente quello che SAP restituisce. Acceso, ogni fantasma viene sostituito dai suoi componenti: nell'albero del cockpit, nell'auto-assegnazione manuale, nel job pianificato e nello spacchettamento. Nota: SAP di norma dissolve gi\u00e0 i fantasma alla creazione dell'ordine, quindi spesso l'effetto visibile \u00e8 la sola sparizione della riga fantasma, senza nuovi componenti aggiunti.
phxHelpSharedSave=Questi parametri e i due interruttori delle schede Cicli di lavorazione e Ordini di produzione sono un unico record: salvare da una qualunque delle tre schede li persiste tutti.
phxBtnSave=Salva
phxBtnCancel=Annulla
phxSaved=Configurazione di esplosione salvata per il plant {0}. Ha effetto dalla prossima lettura; i cicli e gli ordini gi\u00e0 inviati non vengono rielaborati.
phxSaveError=Errore nel salvataggio della configurazione di esplosione: {0}
# Validazione lato server (letta da srv/cat-service.js: validatePhantomExplodeConfig)
phxPlantMandatory=Il plant \u00e8 obbligatorio
phxPlantFormat=Il plant deve avere da 1 a 4 caratteri alfanumerici maiuscoli
phxDepthRange=La profondit\u00e0 massima di esplosione deve essere un numero intero fra {0} e {1}: attualmente vale {2}.
