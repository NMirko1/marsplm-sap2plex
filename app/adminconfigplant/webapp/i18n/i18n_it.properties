# ============================================================
# [CONF-POSTING] Feature 0028 \u2014 Consumi e scarti della consuntivazione, per plant
# ============================================================
tabConfPosting=Consuntivazione
cpcTabIntro=Cosa diventano in SAP le registrazioni di produzione che tornano da Plex: QUANDO si consumano i componenti, e che sorte hanno quando un pezzo viene SCARTATO. Senza configurazione, o con i valori predefiniti, il comportamento \u00e8 esattamente quello che c'era prima che questa scheda esistesse.
cpcNotConfigured=Il plant {0} non \u00e8 configurato: i componenti si consumano solo all''operazione di versamento e si consuma l''intera distinta, uno scarto registra il solo prodotto finito, e uno scarto senza lotto di produzione non viene registrato. Per cambiare uno di questi comportamenti, salva questa scheda.
# [CONF-POSTING] Feature 0030 \u2014 chi porta in SAP la produzione.
cpcGroupChannel=Canale della produzione
cpcLblProdPosting=La produzione arriva in SAP come
cpcProdPostingMATDOC=I nostri documenti materiale (261 + 101)
cpcProdPostingCONF=Una conferma d'ordine (i movimenti li fa SAP)
cpcHelpProdPosting=La prima voce \u00e8 quello che avviene oggi e resta il predefinito: il consumo dei componenti e il versamento del prodotto li registriamo noi. Con la seconda si registra UNA conferma d'ordine e i movimenti li fa SAP \u2014 versamento automatico dal control key, prelievo retrogrado dei componenti \u2014 quindi i nostri due documenti della produzione non partono pi\u00f9. La conferma parte solo all'ULTIMA operazione del ciclo Plex dell'ordine; una registrazione su un'operazione intermedia viene archiviata, e il messaggio lo dice. Lo SCARTO resta un documento materiale in entrambi i casi: la conferma non sa esprimerlo senza registrarlo sopra al nostro.
cpcLblConfPostEnabled=Registra la conferma
cpcConfPostEnabledText=Invia le conferme d'ordine a SAP
cpcHelpConfPostEnabled=A interruttore spento le righe di conferma si COSTRUISCONO comunque e restano in attesa: il giorno in cui si accende, l'arretrato parte da s\u00e9. Non \u00e8 il flag di prova dei movimenti merci del plant: una conferma non ha una modalit\u00e0 di prova \u2014 o SAP la registra o no, e l'unico ritorno \u00e8 uno storno in CO13 \u2014 quindi accenderla \u00e8 una decisione a parte. \u00c8 l'unico interruttore: nessuna variabile d'ambiente pu\u00f2 contraddire questa spunta.
cpcGroupProduct=Prodotto buono
cpcGroupScrap=Scarto
cpcGroupSapValues=Valori passati a SAP
cpcLblConsumeAt=Consumo dei componenti
cpcConsumeAtLAST=Solo all'operazione di versamento (intera distinta)
cpcConsumeAtEACH_OP=A ogni operazione confermata (i suoi componenti)
cpcHelpConsumeAt=La BBP \u00a78.3.3 chiede la prima opzione, che \u00e8 il valore predefinito. La seconda consuma, a ogni operazione confermata, i componenti che l'ALBERO PLEX dell'ordine appende a quella operazione; il versamento del prodotto resta comunque solo all'operazione di versamento, perch\u00e9 un prodotto si versa una volta. Con la seconda opzione un componente che l'albero non ha mai collocato non viene consumato mai, e il fatto viene dichiarato.
cpcLblScrapConsume=Componenti in caso di scarto
cpcScrapConsumeNONE=Nessuno: si muove solo il prodotto
cpcScrapConsumeUP_TO_OP=Fino all'operazione di scarto (intera distinta all'ultima)
cpcScrapConsumeALL=L'intera distinta
cpcHelpScrapConsume=La BBP \u00a78.4.1 chiede il CONSUMO dei componenti, e l'opzione centrale ha due braccia: su un'operazione intermedia i componenti da quell'operazione alla prima, all'operazione di versamento l'intera distinta. La quantit\u00e0 di riferimento \u00e8 sempre quella SCARTATA. A quale operazione appartiene un componente lo dice l'ALBERO PLEX dell'ordine, non la prenotazione SAP: se in quell'albero nessun componente \u00e8 assegnato a un'operazione, lo scarto resta in attesa e viene dichiarato invece di consumare l'intera distinta.
cpcLblScrapMove=Imputazione dei componenti
cpcScrapMoveISSUE=261 con riferimento all'ordine (il costo resta sull'ordine)
cpcScrapMoveSCRAP=551 con riferimento all'ordine (il costo esce dall'ordine)
cpcHelpScrapMove=Sceglie l'imputazione, non se consumare: quello lo decide il campo qui sopra. Il centro di costo e la causale non si configurano qui \u2014 li deriva la parte ABAP dall'ordine e dalle sue operazioni.
cpcLblScrapIssue=Movimento del prodotto
cpcScrapIssueALWAYS=A qualunque operazione
cpcScrapIssueGR_OP_ONLY=Solo all'operazione di versamento
cpcHelpScrapIssue=La BBP \u00a78.5.2 dice che il WIP intermedio non entra in SAP, quindi su un'operazione intermedia non esiste giacenza del prodotto finito da scaricare: quel movimento o viene rifiutato o preleva pezzi buoni di altri ordini. La seconda opzione \u00e8 quella prudente; la prima \u00e8 quello che accadeva prima di questa scheda.
cpcLblScrapNoOrder=Scarto di un pezzo gi\u00e0 versato
cpcScrapNoOrderOFF=Non registrato (dichiarato nel recap del job)
cpcScrapNoOrderPOST=551 senza riferimento all'ordine
cpcHelpScrapNoOrder=Plex registra questo scarto senza lotto di produzione, quindi non c'\u00e8 un ordine SAP: i componenti sono gi\u00e0 stati addebitati dal versamento, e si scarica il solo prodotto. Il materiale si risolve dal dizionario delle part Plex; il magazzino qui sotto diventa obbligatorio, perch\u00e9 non c'\u00e8 una testata d'ordine da cui prenderlo.
cpcLblStorLoc=Magazzino di prelievo (LGORT_FROM)
cpcHelpStorLoc=Da dove esce lo scarto. Vuoto significa \u00abcome prima\u00bb, cio\u00e8 il magazzino della testata dell'ordine.
cpcLblReason=Causale del movimento (MOVE_REAS)
cpcHelpReason=Quattro cifre, con gli zeri davanti aggiunti al salvataggio: digitando 13 si salva 0013. Vuoto significa nessuna causale inviata.
cpcLblHeadTxt=Testo di testata del documento
cpcHelpHeadTxt=Una stringa fissa e riconoscibile in MB51; il numero del lotto Plex viene accodato finch\u00e9 i 25 caratteri lo consentono. Vuoto significa il testo composto come prima.
cpcLblLateTxt=Testo riga dello scarto senza lotto
cpcHelpLateTxt=\u00c8 il modo in cui lo scarto di un pezzo gi\u00e0 versato si distingue in SAP: un testo, non un'imputazione diversa. Usato solo quando il campo qui sopra \u00e8 impostato per registrare.
cpcBtnSave=Salva
cpcBtnCancel=Annulla
cpcSaved=Impostazioni di consumo e scarto salvate per il plant {0}. Valgono dalla prossima esecuzione del job PROD_CONF; le registrazioni gi\u00e0 inviate non vengono rielaborate.
cpcSaveError=Salvataggio non riuscito: {0}
# Validazione lato server (srv/cat-service.js e srv/lib/confPostingRules.js), letta a runtime.
cpcPlantMandatory=Il plant \u00e8 obbligatorio
cpcPlantFormat=Il plant deve essere da 1 a 4 caratteri fra lettere maiuscole e cifre
cpcDuplicate=Il plant {0} ha gi\u00e0 una configurazione di consumi e scarti: pu\u00f2 esistere una sola riga per plant
cpcModeInvalid=Valore non ammesso: scegline uno fra {0}
cpcDoubleCharge=Consumare a ogni operazione E consumare di nuovo i componenti in caso di scarto li addebita due volte: un pezzo scartato ha gi\u00e0 consumato quello che ha percorso. O si consuma solo all'operazione di versamento, o i componenti dello scarto restano su \u00abNessuno\u00bb.
cpcStorLocRequired=Uno scarto senza lotto di produzione non ha una testata d'ordine, quindi il magazzino non \u00e8 derivabile: va indicato
cpcLateTxtUnused=Questo testo si usa solo quando lo scarto di un pezzo gi\u00e0 versato viene registrato: o si abilita quello, o si svuota il testo
cpcEachOpNotWithConf=Con la conferma d'ordine il punto di consumo dice DOVE confermare, e \u00aba ogni operazione confermata\u00bb vorrebbe dire pi\u00f9 conferme finali sullo stesso ordine, cio\u00e8 pi\u00f9 volte la quantit\u00e0 confermata. Mettere il punto di consumo su \u00abSolo all'operazione di versamento\u00bb, o tornare ai documenti materiale.
cpcConfEnabledWithoutConf=La registrazione della conferma \u00e8 accesa mentre la produzione arriva in SAP come documenti materiale: nessuna conferma partirebbe mai. O si scegle il canale della conferma, o si spegne questo interruttore.
# Le tre impostazioni che riproducono la regola dichiarata dal cliente, in un posto solo.
cpcRecipe=La regola concordata con Ariston: all'ULTIMA operazione un 551 del materiale di testata pi\u00f9 un 261 sull'intera distinta; su un'operazione INTERMEDIA solo un 261 sui componenti da quell'operazione Plex alla prima, e nessun 551. Da impostare: componenti in caso di scarto = \u00abFino all'operazione di scarto\u00bb, movimento del prodotto = \u00abSolo all'operazione di versamento\u00bb, imputazione dei componenti = \u00ab261 con riferimento all'ordine\u00bb.

