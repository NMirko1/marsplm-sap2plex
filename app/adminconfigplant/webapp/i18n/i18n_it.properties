tecHelpEnabled=Spento, la chiusura viene solo RILEVATA e registrata in attesa: su Plex non si scrive niente. Quando lo accendi l'arretrato si chiude da s\u00e9 alla prima esecuzione \u2014 nel frattempo non si perde nulla.
