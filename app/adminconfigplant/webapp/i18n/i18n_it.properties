# ============================================================
# [ORDER-COMPLETE] Il job Plex completato -> stato utente sull'ordine SAP (feature 0045, W1-12).
# Tab "Ordini di produzione", quarta sezione. Verso opposto della chiusura tecnica qui sopra.
# ============================================================
cmpGroupTitle=Job completato su Plex \u2192 stato utente in SAP
cmpNotConfigured=Il plant {0} non ha una configurazione dei job completati: quando in fabbrica il lotto finisce, in SAP non se ne vede traccia. Indica gli stati Plex che valgono \u00abfinito\u00bb e salva.
cmpLblEnabled=Scrivi lo stato utente in SAP
cmpHelpEnabled=Spento, il completamento viene solo RILEVATO e registrato in attesa: in SAP non si scrive niente. Quando lo accendi l'arretrato parte da s\u00e9 alla prima esecuzione \u2014 nel frattempo non si perde nulla. Questa casella \u00e8 l'unico interruttore: non c'\u00e8 nessuna leva di sistema sopra, quindi da acceso il job scrive su ordini veri gi\u00e0 alla prima esecuzione.
cmpLblStatuses=Stati Plex che valgono \u00abfinito\u00bb
cmpPhStatuses=Scrivi uno stato e premi Invio
cmpHelpStatuses=Basta che il job Plex sia in UNO di questi stati. Di norma \u00e8 Completed. NON c'\u00e8 un elenco da scegliere perch\u00e9 gli stati dei job sono una tabella di configurazione del tuo tenant Plex, non del prodotto: scrivili come li vedi in Plex. Se sbagli a scriverli non vedrai un errore, vedrai zero ordini trattati \u2014 il recap dell'esecuzione elenca gli stati che ha visto davvero, ed \u00e8 da l\u00ec che si capisce.
cmpHelpEmpty=Con l'interruttore acceso serve almeno uno stato: senza criterio non verrebbe dichiarato mai niente, e la configurazione sembrerebbe attiva pur non facendo nulla.
cmpBtnSave=Salva
cmpBtnCancel=Annulla
cmpSaved=Configurazione dei job completati salvata per il plant {0}. Vale dalla prossima esecuzione.
cmpSaveError=Errore nel salvataggio della configurazione dei job completati: {0}
cmpNoStatuses=Con la scrittura in SAP abilitata serve almeno uno stato Plex: senza criterio nessun ordine verrebbe mai dichiarato, e la configurazione sembrerebbe attiva pur non facendo nulla.
# -- messaggi di validazione del server (srv/cat-service.js)
completePlantMandatory=Il plant \u00e8 obbligatorio
completePlantFormat=Il plant deve essere di 1-4 caratteri alfanumerici maiuscoli
completeStatusesMandatory=Con la scrittura in SAP abilitata serve almeno uno stato Plex: senza criterio nessun ordine verrebbe mai dichiarato, e la configurazione sembrerebbe attiva pur non facendo nulla.
completeListTooLong=La lista supera {0} caratteri
completeDuplicate=Il plant {0} ha gi\u00e0 una configurazione dei job completati

# ============================================================
# [ORDER-SCHEDULED] Il job Plex pianificato -> stato utente sull'ordine SAP (feature 0046, W1-11).
# Tab "Ordini di produzione", quinta sezione. Gemella della quarta sull'altro estremo del ciclo.
# ============================================================
schGroupTitle=Job pianificato su Plex \u2192 stato utente in SAP
schNotConfigured=Il plant {0} non ha una configurazione dei job pianificati: quando in Plex un lotto viene pianificato, in SAP non se ne vede traccia. Indica gli stati Plex che valgono \u00abpianificato\u00bb e salva.
schLblEnabled=Scrivi lo stato utente in SAP
schHelpEnabled=Spento, il rilevamento gira comunque e il job resta registrato in attesa: in SAP non si scrive niente. Quando lo accendi l'arretrato parte da s\u00e9 alla prima esecuzione \u2014 nel frattempo non si perde nulla. Questa casella \u00e8 l'unico interruttore: non c'\u00e8 nessuna leva di sistema sopra, quindi da acceso il job scrive su ordini veri gi\u00e0 alla prima esecuzione.
schLblStatuses=Stati Plex che valgono \u00abpianificato\u00bb
schPhStatuses=Scrivi uno stato e premi Invio
schHelpStatuses=Basta che il job Plex sia in UNO di questi. Di norma \u00e8 Scheduled. NON c'\u00e8 un elenco da scegliere perch\u00e9 gli stati dei job sono una tabella di configurazione del tuo tenant Plex, non del prodotto: scrivili come li vedi in Plex. Se sbagli a scriverli non vedrai un errore, vedrai zero ordini trattati \u2014 il recap dell'esecuzione elenca gli stati che ha visto davvero, ed \u00e8 da l\u00ec che si capisce.
schHelpSnapshot=Il job guarda gli stati COME SONO ADESSO, non i cambiamenti avvenuti: se un lotto entra ed esce da \u00abScheduled\u00bb fra due esecuzioni, quel passaggio non viene visto. Per non perderlo puoi elencare anche gli stati successivi (per esempio Sequenced), al prezzo di dichiarare \u00abpianificato\u00bb un ordine che \u00e8 gi\u00e0 oltre.
schHelpEmpty=Con l'interruttore acceso serve almeno uno stato: senza criterio non verrebbe dichiarato mai niente, e la configurazione sembrerebbe attiva pur non facendo nulla.
schBtnSave=Salva
schBtnCancel=Annulla
schSaved=Configurazione dei job pianificati salvata per il plant {0}. Vale dalla prossima esecuzione.
schSaveError=Errore nel salvataggio della configurazione dei job pianificati: {0}
schNoStatuses=Con la scrittura in SAP abilitata serve almeno uno stato Plex: senza criterio nessun ordine verrebbe mai dichiarato, e la configurazione sembrerebbe attiva pur non facendo nulla.
# -- messaggi di validazione del server (srv/cat-service.js)
schedPlantMandatory=Il plant \u00e8 obbligatorio
schedPlantFormat=Il plant deve essere di 1-4 caratteri alfanumerici maiuscoli
schedStatusesMandatory=Con la scrittura in SAP abilitata serve almeno uno stato Plex: senza criterio nessun ordine verrebbe mai dichiarato, e la configurazione sembrerebbe attiva pur non facendo nulla.
schedListTooLong=La lista supera {0} caratteri
schedDuplicate=Il plant {0} ha gi\u00e0 una configurazione dei job pianificati

