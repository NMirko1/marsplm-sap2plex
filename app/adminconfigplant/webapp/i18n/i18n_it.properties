roOpTypeNotListed=Queste righe puntano a un'operazione che non compare nell'elenco: {0}. O il filtro per tipo della scheda \u00abMappatura Operazioni Plex\u00bb la esclude, oppure su Plex non esiste pi\u00f9: in entrambi i casi la tendina risulta vuota e il tipo non \u00e8 verificabile.
