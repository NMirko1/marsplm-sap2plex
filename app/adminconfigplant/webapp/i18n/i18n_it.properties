phxGroupCompSource=Sorgente dei componenti del ciclo
phxDefaultOpWarn=Con questa opzione accesa l'albero SAP del ciclo nel cockpit non \u00e8 pi\u00f9 quello di SAP: i componenti non vengono dall'assegnazione componente-operazione ma dalla distinta base, e compaiono tutti sotto una sola operazione. La collocazione sulle operazioni Plex non cambia: continuano a deciderla le regole di assegnazione automatica.
phxLblCompDefaultOp=Usa una posizione di default per i componenti del ciclo
phxCompDefaultOpText=Leggi i componenti dalla distinta base
phxHelpCompDefaultOp=Spento, i componenti del ciclo sono quelli che SAP aggancia alle operazioni, ognuno sulla sua. Acceso, si legge invece la distinta base del materiale di testata e ogni suo componente compare sull'operazione scelta qui sotto. Serve ai plant in cui in SAP nessuno aggancia i componenti alle operazioni: senza questa opzione l'albero del ciclo resterebbe vuoto.
phxLblCompDefaultOpTarget=Operazione di default
phxHelpCompDefaultOpTarget=Su quale operazione SAP del ciclo compaiono tutti i componenti letti dalla distinta. Si risolve per posizione sulla numerazione delle operazioni della sequenza principale: la pi\u00f9 bassa o la pi\u00f9 alta.
