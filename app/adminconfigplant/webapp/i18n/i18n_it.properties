roTabIntro=Definisci, per ogni unit\u00e0 di misura, l'operazione Plex con cui si riceve un materiale che Plex non produce. Un materiale senza ciclo su Plex non ha nessuna operazione, quindi non c'\u00e8 niente su cui riceverlo: questa \u00e8 l'operazione che MARS crea sulla part, una volta per materiale e stabilimento. Cambiando qui l'operazione, i materiali gi\u00e0 inviati vengono portati sulla nuova alla prossima sincronizzazione; disattivare o cancellare una riga invece non spegne niente su Plex.
roTabHint=Quali materiali la richiedono lo decide la loro classe, nella scheda \u00abCategorie Materiali\u00bb. L'operazione Plex deve gi\u00e0 esistere nel tenant Plex: MARS la istanzia sulla part, non la crea.
