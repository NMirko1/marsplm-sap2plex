ppcStatusHint=Uno stato per plant, mandato SOLO alla creazione di una part: un aggiornamento non riscrive uno stato cambiato a mano su Plex. L'etichetta \u00e8 ci\u00f2 che ogni altra schermata mostra al posto del codice.
ppcTableTitle=Codici delle tipologie prodotto
ppcTypeHint=Una riga per tipologia prodotto Plex. L'elenco porta le tipologie che Plex conosce, non le classi materiale: una classe che per MARS \u00e8 \u00abSemifinished External\u00bb per Plex \u00e8 un componente, e lo dice gi\u00e0 il seed.
