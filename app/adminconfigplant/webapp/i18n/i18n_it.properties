tabPlexPartCodes=Codici Plex
ppcTabIntro=Su Plex il tipo e lo stato di un prodotto sono righe di una tabella di setup, e il valore che Plex si aspetta non \u00e8 quello che MARS conosce: il seed dice \u00abComponent\u00bb, il tenant di Albacina dice \u00abMateria prima\u00bb. Qui si dichiara, per ogni tipologia, il valore che quel tenant si aspetta \u2014 e con quale stato nasce una part.
ppcTabHint=I valori sono del tenant Plex del plant, quindi si configurano per plant. Nessun valore configurato = si manda la tipologia che MARS conosce, cos\u00ec com'\u00e8: l'invio pu\u00f2 essere rifiutato da Plex, che nomina il campo sbagliato. Plex ha rifiutato la chiave numerica (Part_Type_Key 34670): usa il nome che compare nella schermata di setup di Plex.
