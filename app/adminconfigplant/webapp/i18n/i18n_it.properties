# ---- VINCOLI DI UNICIT\u00c0 (lato server, ultima rete) ----
# [UNIQUE-VIOLATION] @assert.unique \u00e8 solo compile-time: genera un indice sul database e non un
# handler, quindi una violazione usciva come 500 col testo grezzo di HANA. I controlli in before
# non possono essere l'unica difesa - dentro un change set di $batch CAP lancia le sottorichieste
# in PARALLELO, quindi due righe identiche salvate insieme non si vedono fra loro.
# Vedi srv/lib/uniqueConstraintError.js. Chiave con segnaposto: SENZA apostrofi (MessageFormat).
uniqueConstraintViolation=Esiste gi\u00e0 una riga con questi valori: {0}. Ogni combinazione pu\u00f2 essere presente una sola volta.

