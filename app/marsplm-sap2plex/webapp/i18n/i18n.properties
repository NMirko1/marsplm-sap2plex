# ================================================================
# [DETAIL-REREAD] A row that is not the one asked for is RE-READ and PICKED by key.
#
# `detailKeyMismatch` is GONE on purpose: it said \u00abit is not shown\u00bb, and after this feature that is
# false in the normal case \u2014 a served row that is not the requested one is now re-read and picked,
# and the defect is declared in the console (plus the server's own [KEY-READ] line). What is left
# for the user are the two outcomes that are genuinely different from each other:
#   *NotFound      -> we looked, and the row is not there
#   detailReadFailed -> we could not look. It must NOT read as \u00abthis object does not exist\u00bb.
# The three keys are named per screen because the identity of an object is not the same thing on
# the three of them: (routing, material), (material, plant), order.
# grep -rn "DETAIL-REREAD"
# ================================================================
routingMaterialNotFound=Routing {0}/{1} for material {2} not found: it is not in the visible scope, or the active channel does not return it.
productNotFound=Material {0} for plant {1} not found: it is not in the configured scope, or the active channel does not return it.
prodOrderNotFound=Production order {0} not found: it is not in the configured scope, or the active channel does not return it.
