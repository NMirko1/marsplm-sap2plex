splitRollbackFailed=Warning: the split failed and it was not possible to restore the previous quantity. Main job {0} stayed at {1} {2} instead of {3} {2} and no package was created: {4} {2} are not in production on any job. Reopen the split window and use the Restore command to give the quantity back to the main job. Do not start further splits on this order until the situation is settled.
