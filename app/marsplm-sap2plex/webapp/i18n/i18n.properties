# [BOM-AUTODEPLETE] W1-06: shown INSTEAD of the plain success box when at least one BOM line was
# sent but \u00abautoDeplete = false\u00bb could not be verified. The cycle did reach Plex, so this is not an
# error \u2014 but an active Autodeplete flag makes Plex consume the components on its own, and the 261
# movements MARS posts in SAP consume them a second time. Details are in the sync log JSON.
syncPlexAutodepleteUnverified=On {0} BOM line(s) \u00abautoDeplete = false\u00bb is not verified: the flag is active on a line that was already on Plex, or the field is missing from the Plex response. If Autodeplete is active, components are consumed twice \u2014 once by Plex and once by the SAP goods movements. Check the sync log details.
syncPlexWcExcessNotRemoved={0} work center removed from the cycle are still approved on the Plex operations: the removal was not carried out. Until they are removed the operator still sees them in Plex, and a work center moved between two operations stays approved on both. Check the sync log details for the reason.
# [ROUTING-BY-MATERIAL] Shown in the routings list when the SAP routing exists but has no
# material assignment at all: an empty cell would read as missing data instead of a fact.
routingNoMaterial=(no material assigned)
# Server-side (srv/cat-service.js, saveRoutingPlexCycle): the material is the scope of the
# delete-then-insert, so saving without it would wipe the cycles of the routing's other materials.
routingCycleMaterialRequired=Cannot save the Plex cycle: no header material. On Plex a cycle lives on a part, so it always belongs to one material of the routing.

