splitPkgScheduleFailed=Package {0} was created with {1} {2}, but its scheduling failed: it may not be immediately workable. Schedule it in Plex. Do not repeat the split.
splitPkgAlignFailed=Package {0} was created and scheduled, but the alignment of operations and components with the SAP order failed: it may contain operations or components that are no longer expected. Check it in Plex before putting it into production.
splitPkgNotLinked=Package {0} exists in Plex but is not linked to order {1} yet: production entries booked on it would not flow back to SAP. Do not put it into production: reopen the split window and complete the operation.
splitHistoryNotWritten=The split was performed correctly, but it could not be recorded in the order history. Note the operation down and report it to the operations team.
splitResidualToLink=This order has an operation to be completed: package {0} of {1} {2} exists in Plex but is not linked to the SAP order. Complete the link: the quantity will not be subtracted a second time and no second package will be created.
splitResidualToRestore=This order has a quantity to be restored: a split attempt subtracted {0} {1} from the main job without creating package {2}, and the automatic restore failed. Use Restore to give the quantity back to the main job. No package will be created.
splitUnexpectedError=The split did not complete because of an unexpected error. Reopen the window to see the updated status of the order before repeating the operation. Detail: {0}.
splitRestoreDone=Quantity restored. Main job {0} is back to {1} {2} and no package was created. Code {3} stays unusable.
splitCompleteDone=Link completed. Package {0} is now linked to order {1}: production entries booked on it will flow back to SAP as order confirmations.
splitCreatedButUnconfirmed=Split completed, with a reservation: Plex did not confirm the creation of package {0}, but the following check found it with {1} {2}. The split is therefore complete and the main job is at {3} {2}. Do not repeat the operation: it would create a second package. If you want a visual confirmation, check job {0} in Plex.
splitUncertain=Warning: it was not possible to determine whether package {0} was created in Plex. No answer came back from the creation and the check had no outcome either. The main job quantity was reduced to {1} {2} and was deliberately not restored: restoring it without knowing whether the package exists would risk putting more quantity into production than ordered. Check in Plex whether job {0} exists, then reopen this window: the system will repeat the check and offer the right command. In the meantime do not start other splits on this order and do not change quantities manually.
splitStillUncertain=This order has an operation with an uncertain outcome: it is not known whether package {0} of {1} {2} exists in Plex, and the quantity has already been subtracted from the main job. The check has not succeeded yet. Check in Plex whether job {0} exists and try again later: while the state is not established no action is offered, so as not to make things worse.
