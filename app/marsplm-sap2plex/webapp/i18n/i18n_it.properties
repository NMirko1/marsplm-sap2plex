logConfPostNotEnabled={0} conferme d''ordine NON inviate: ConfPostEnabled non \u00e8 acceso su questo plant. Si costruiscono comunque, e l''arretrato parte da s\u00e9 il giorno in cui si accende
logConfPostConfigUnreadable={0} conferme d''ordine NON inviate: la configurazione del plant non \u00e8 leggibile, e qui il comportamento predefinito (documenti materiale) non \u00e8 un ripiego valido. Restano in attesa
