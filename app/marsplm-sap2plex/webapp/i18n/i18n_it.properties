# [MAT-SCOPE] feature 0050 \u2014 un materiale \u00e8 in perimetro solo se una categoria gli assegna una
# tipologia Plex. I quattro rifiuti NOMINANO IL RIMEDIO, perch\u00e9 finiscono davanti a chi deve
# agire: i primi due sono customizing (configurazione plant), gli ultimi due una lettura caduta.
# ATTENZIONE: in un messaggio CON PARAMETRI l'apostrofo semplice \u00e8 il carattere di quoting di
# MessageFormat e si porterebbe via i segnaposto. Si usano gli accenti veri (\u00e8, pu\u00f2, cos\u00ec), come
# il resto di questo file; se serve un apostrofo va RADDOPPIATO (vedi logMatOpTypeMissing).
logMatNoCategory=materiale {0}: nessuna categoria attiva del plant {1} lo classifica, quindi \u00e8 fuori perimetro e non \u00e8 stato inviato niente a Plex (scheda \u00abCategorie Materiali\u00bb della configurazione plant)
logMatCategoryNoPartType=materiale {0}: la categoria del plant {1} che lo classifica non assegna una tipologia Plex, quindi Plex rifiuterebbe la part: non \u00e8 stato inviato niente (scheda \u00abCategorie Materiali\u00bb della configurazione plant)
logMatScopeDetailUnknown=materiale {0}: anagrafica non letta, quindi non si pu\u00f2 stabilire se ha una categoria sul plant {1}: non \u00e8 stato inviato niente, il run successivo riprova
logMatScopeCategoriesUnknown=materiale {0}: il customizing delle categorie del plant {1} non si \u00e8 potuto leggere, quindi non \u00e8 stato inviato niente: una lettura caduta non dimostra che la categoria non ci sia
logMatOutOfScope=materiale {0}: fuori perimetro sul plant {1}, non \u00e8 stato inviato niente a Plex
logMatScopePruned=plant {0}: {1} materiali in perimetro su {2} \u2014 {3} senza categoria, {4} con una categoria che non assegna la tipologia Plex
logMatScopeHeld=plant {0}: {1} materiali trattenuti perch\u00e9 non si \u00e8 potuto stabilire se hanno una categoria ({2} anagrafica non letta, {3} customizing non letto)
logMatScopeUntyped=plant {0}: categorie attive SENZA tipologia Plex \u2014 {1}. Finch\u00e9 restano cos\u00ec, i materiali che classificano non entrano in perimetro
logMatNoTypeCodes=plant {0}: nessun codice Plex configurato per {1} \u2014 le part escono con la tipologia come stringa (scheda \u00abCodici Plex\u00bb della configurazione plant)
logMatOpCatalogUnreadable=plant {0}: catalogo operazioni Plex non leggibile \u2014 il tipo delle operazioni di ricevimento non \u00e8 verificabile e il POST partirebbe con il valore storico \u00ab{1}\u00bb, che un tenant senza un tipo con quel nome rifiuta
logMatOpTypeMissing=plant {0}: il catalogo Plex non dichiara un tipo per le operazioni di ricevimento {1} \u2014 il POST parte con il valore storico \u00ab{2}\u00bb, che un tenant senza un tipo con quel nome rifiuta, e l''operazione di ricevimento non nasce (il tipo va sistemato su Plex, non qui)
logMatRecreated=part ricreata su Plex (CREATE fallback): la part era stata cancellata
logMatAlreadyOnPlex=part gi\u00e0 presente su Plex (id {0}): mapping ripristinato, dati NON aggiornati
logMatSentTo={0} -> Plex ID {1}
logMatRecvOpFailed=creazione dell''operazione di ricevimento NON riuscita
logMatRecvOpInactive=operazione di ricevimento presente su Plex ma DISATTIVATA: va riattivata su Plex
logMatRecvOpTotal={0} coppie (materiale, plant) sono uscite su Plex ma la loro operazione di ricevimento non \u00e8 utilizzabile: chiamata fallita, oppure operazione gi\u00e0 presente su Plex ma disattivata. Il JSON di risposta delle righe in attenzione dice quale dei due, e porta la traccia delle letture verso Plex \u2014 al prossimo run vengono ritentati
logMatSendFailedGeneric=invio non riuscito

