routingCompSourceFromBom=Questo non \u00e8 quello che c''\u00e8 in SAP: il plant {1} legge i componenti del ciclo dalla distinta base, quindi compaiono tutti sull''operazione {0}. In SAP possono essere agganciati ad altre operazioni, o a nessuna. Dove finiscono su Plex lo decidono le regole di assegnazione automatica, come sempre.
routingCompSourceNoBom=Il plant legge i componenti del ciclo dalla distinta base, ma il materiale {0} non ha una distinta, oppure non ha posizioni. L''albero \u00e8 vuoto perch\u00e9 non c''\u00e8 niente da leggere, non perch\u00e9 il ciclo sia senza componenti. In questo stato il ciclo non verr\u00e0 inviato a Plex.
routingCompSourceFellBack=Questo plant \u00e8 configurato per leggere i componenti del ciclo dalla distinta base, ma non \u00e8 stato possibile ({0}). Quello che vedi \u00e8 l''assegnazione componente-operazione di SAP, come a opzione spenta.

