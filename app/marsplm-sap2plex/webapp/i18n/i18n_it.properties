splitOrderNotShared=L''ordine {0} non \u00e8 ancora stato condiviso con Plex: non esiste un lotto di lavoro da spacchettare. Condividi prima l''ordine con Plex.
splitPlantNotUsable=Il plant {0} non \u00e8 attivo o non \u00e8 coperto da licenza: l''operazione non \u00e8 consentita. Nessuna modifica \u00e8 stata eseguita.
splitMainLotNotFound=Il lotto di lavoro {0} non \u00e8 pi\u00f9 presente su Plex: potrebbe essere stato cancellato o rinominato. Lo spacchettamento non \u00e8 possibile e nulla \u00e8 stato modificato.
splitQtyPositive=Indica una quantit\u00e0 maggiore di zero.
splitQtyBelowResidual=La quantit\u00e0 del pacchetto deve essere inferiore alla quantit\u00e0 residua del lotto principale, che \u00e8 {0} {1}. Il lotto principale deve restare con una quantit\u00e0 positiva.
splitStateChanged=La situazione dell''ordine \u00e8 cambiata da quando hai aperto la finestra: la quantit\u00e0 residua del lotto principale \u00e8 ora {0} {1}. Nessuna modifica \u00e8 stata eseguita: controlla i dati aggiornati e ripeti l''operazione.
splitQtyDecimals=L''unit\u00e0 di misura {0} ammette al massimo {1} decimali.
splitNothingToSplit=La quantit\u00e0 residua del lotto principale \u00e8 {0} {1} e non \u00e8 ulteriormente divisibile: non \u00e8 possibile creare un pacchetto lasciando al lotto principale una quantit\u00e0 positiva.
splitSuccess=Spacchettamento eseguito. Il lotto principale {0} \u00e8 passato a {1} {2}; \u00e8 stato creato il pacchetto {3} con {4} {2} e la stessa data di consegna dell''ordine.
splitInProgress=\u00c8 gi\u00e0 in corso uno spacchettamento su questo ordine, avviato da un altro utente o da un'altra sessione. Nessuna modifica \u00e8 stata eseguita: riprova fra qualche istante.
splitSequenceExhausted=Sono gi\u00e0 stati assegnati tutti i 9999 progressivi disponibili per l''ordine {0}: non \u00e8 possibile creare altri pacchetti.
splitCodeTaken=Il codice {0} risultava gi\u00e0 utilizzato su Plex da un lotto non creato da questo sistema: il pacchetto \u00e8 stato creato con il codice {1}. Il lotto preesistente non \u00e8 stato modificato.
splitResyncDisabled=L''ordine {0} \u00e8 stato spacchettato in {1} pacchetti: la ri-sincronizzazione verso Plex \u00e8 disattivata, perch\u00e9 riporterebbe il lotto principale alla quantit\u00e0 piena dell''ordine. Nessuna modifica \u00e8 stata eseguita su Plex.
splitQtyMismatch=La quantit\u00e0 dell''ordine SAP ({0} {1}) non coincide con la somma dei lotti su Plex ({2} {1}). L''ordine \u00e8 spacchettato e non viene riallineato automaticamente: valuta come gestire la differenza.
splitRolledBack=Lo spacchettamento non \u00e8 stato eseguito: la creazione del pacchetto {0} non \u00e8 riuscita e la quantit\u00e0 del lotto principale \u00e8 stata riportata a {1} {2}. La situazione \u00e8 la stessa di prima del tentativo e l''ordine non risulta spacchettato. Puoi riprovare: il prossimo pacchetto prender\u00e0 il progressivo successivo. Dettaglio dell''errore: {3}.
splitRolledBackNoReschedule=Lo spacchettamento non \u00e8 stato eseguito e la quantit\u00e0 del lotto principale \u00e8 stata riportata a {0} {1}, ma la sua rischedulazione non \u00e8 riuscita: le fasi del lotto possono essere rimaste allineate alla quantit\u00e0 intermedia. La quantit\u00e0 \u00e8 corretta, non modificarla a mano: verifica e rischedula il lotto {2} su Plex prima di riprovare.
splitRollbackFailed=Attenzione: lo spacchettamento non \u00e8 riuscito e non \u00e8 stato possibile ripristinare la quantit\u00e0 precedente. Il lotto principale {0} \u00e8 rimasto a {1} {2} invece di {3} {2} e nessun pacchetto \u00e8 stato creato: {4} {2} non sono in produzione su nessun lotto. Riapri la finestra di spacchettamento e usa il comando \u00abRipristina\u00bb per riportare la quantit\u00e0 al lotto principale. Non avviare altri spacchettamenti su questo ordine finch\u00e9 la situazione non \u00e8 sanata.
splitMainRescheduleFailed=Lo spacchettamento \u00e8 stato eseguito, ma la rischedulazione del lotto principale non \u00e8 riuscita: le sue fasi possono essere ancora allineate alla quantit\u00e0 precedente. Verifica e rischedula il lotto {0} su Plex. Non ripetere lo spacchettamento.
splitPkgScheduleFailed=Il pacchetto {0} \u00e8 stato creato con {1} {2}, ma la sua schedulazione non \u00e8 riuscita: potrebbe non essere immediatamente lavorabile. Schedulalo su Plex. Non ripetere lo spacchettamento.
splitPkgAlignFailed=Il pacchetto {0} \u00e8 stato creato e schedulato, ma l''allineamento di fasi e componenti all''ordine SAP non \u00e8 riuscito: potrebbe contenere fasi o componenti non pi\u00f9 previsti. Verificalo su Plex prima di metterlo in lavorazione.
splitPkgNotLinked=Il pacchetto {0} esiste su Plex ma non \u00e8 ancora collegato all''ordine {1}: le registrazioni di produzione fatte su di esso non tornerebbero in SAP. Non metterlo in lavorazione: riapri la finestra di spacchettamento e completa l''operazione.
splitHistoryNotWritten=Lo spacchettamento \u00e8 stato eseguito correttamente, ma non \u00e8 stato possibile registrarlo nello storico dell'ordine. Annota l'operazione e segnalala all'esercizio.
splitResidualToLink=Su questo ordine c''\u00e8 un''operazione da completare: il pacchetto {0} da {1} {2} esiste su Plex ma non \u00e8 collegato all''ordine SAP. Completa il collegamento: la quantit\u00e0 non verr\u00e0 scalata una seconda volta e non verr\u00e0 creato un secondo pacchetto.
splitResidualToRestore=Su questo ordine c''\u00e8 una quantit\u00e0 da ripristinare: un tentativo di spacchettamento ha scalato {0} {1} dal lotto principale senza riuscire a creare il pacchetto {2}, e il ripristino automatico non \u00e8 riuscito. Usa \u00abRipristina\u00bb per riportare la quantit\u00e0 al lotto principale. Non verr\u00e0 creato alcun pacchetto.
splitUnexpectedError=Lo spacchettamento non \u00e8 andato a buon fine per un errore imprevisto. Riapri la finestra per vedere lo stato aggiornato dell''ordine prima di ripetere l''operazione. Dettaglio: {0}.
splitRestoreDone=Quantit\u00e0 ripristinata. Il lotto principale {0} \u00e8 tornato a {1} {2} e nessun pacchetto \u00e8 stato creato. Il codice {3} resta comunque non riutilizzabile.
splitCompleteDone=Collegamento completato. Il pacchetto {0} \u00e8 ora collegato all''ordine {1}: le registrazioni di produzione fatte su di esso torneranno in SAP come conferme dell''ordine.
splitCreatedButUnconfirmed=Spacchettamento eseguito, con una riserva: Plex non ha confermato la creazione del pacchetto {0}, ma la verifica successiva lo ha ritrovato con {1} {2}. La suddivisione \u00e8 quindi completa e il lotto principale \u00e8 a {3} {2}. Non ripetere l''operazione: creerebbe un secondo pacchetto. Se vuoi una conferma visiva, controlla il lotto {0} su Plex.
splitUncertain=Attenzione: non \u00e8 stato possibile stabilire se il pacchetto {0} sia stato creato su Plex. La risposta alla creazione non \u00e8 arrivata e nemmeno la verifica ha avuto esito. La quantit\u00e0 del lotto principale \u00e8 stata ridotta a {1} {2} e non \u00e8 stata ripristinata di proposito: ripristinarla senza sapere se il pacchetto esiste rischierebbe di mettere in produzione pi\u00f9 quantit\u00e0 di quella ordinata. Verifica su Plex se il lotto {0} esiste, poi riapri questa finestra: il sistema ripeter\u00e0 la verifica e proporr\u00e0 l''azione corretta. Nel frattempo non avviare altri spacchettamenti su questo ordine e non modificare le quantit\u00e0 a mano.
splitStillUncertain=Su questo ordine c''\u00e8 un''operazione dall''esito incerto: non si sa se il pacchetto {0} da {1} {2} esista su Plex, e la quantit\u00e0 \u00e8 gi\u00e0 stata scalata dal lotto principale. La verifica non \u00e8 ancora riuscita. Controlla su Plex se il lotto {0} esiste e riprova pi\u00f9 tardi: finch\u00e9 lo stato non \u00e8 accertato non viene proposta alcuna azione, per non peggiorare la situazione.
splitAssumptionNoWorkInProgress=Lo spacchettamento presuppone che sul lotto principale la produzione non sia ancora iniziata. Il sistema non lo verifica: se la lavorazione \u00e8 gi\u00e0 partita, controlla su Plex quanto \u00e8 stato prodotto prima di confermare.

