logConfClaimUnreadable={0} documenti NON inviati perch\u00e9 la UPDATE di prenotazione non ha restituito un conteggio leggibile. Nessun movimento \u00e8 stato registrato: verificare la forma del risultato di UPDATE su questa versione di @sap/cds
logConfStaleParked={0} documenti erano rimasti in volo da un run morto: parcheggiati, non ritentati. Il movimento POTREBBE essere passato \u2014 verificare in MB51
