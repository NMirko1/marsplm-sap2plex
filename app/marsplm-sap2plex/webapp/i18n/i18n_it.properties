autoAssignConfirmOrphans={0} componenti non esistono pi\u00f9 nell''ordine SAP e spariranno dall''albero: verifica l''ordine in SAP.

# -- [ROUTE-KEY] La rotta e' l'oggetto: il modello si confronta con lei (feature 0041)
sendToPlexStaleDetail=Questa schermata non corrisponde pi\u00f9 al materiale {0} / plant {1}. Ricarica la pagina prima di inviare a Plex.

# ================================================================
# [DETAIL-REREAD] Una riga che non \u00e8 quella chiesta si RILEGGE e si SCEGLIE per chiave.
#
# `detailKeyMismatch` \u00e8 stata TOLTA di proposito: diceva \u00abnon viene mostrato\u00bb, e dopo questa feature
# nel caso normale \u00e8 falso \u2014 una riga servita che non \u00e8 quella chiesta viene riletta e scelta, e il
# difetto si dichiara in console (pi\u00f9 la riga [KEY-READ] del server). All'utente restano i due esiti
# che sono davvero diversi l'uno dall'altro:
#   *NonTrovato      -> ho guardato, e la riga non c'\u00e8
#   detailReadFailed -> non ho potuto guardare. NON deve leggersi come \u00abquesto oggetto non esiste\u00bb.
# Le tre chiavi sono per schermata perch\u00e9 l'identit\u00e0 di un oggetto non \u00e8 la stessa cosa sulle tre:
# (ciclo, materiale), (materiale, plant), ordine.
# grep -rn "DETAIL-REREAD"
# ================================================================
routingMaterialNotFound=Ciclo {0}/{1} per il materiale {2} non trovato: non \u00e8 nel perimetro visibile, o il canale attivo non lo restituisce.
productNotFound=Materiale {0} per il plant {1} non trovato: non \u00e8 nel perimetro configurato, o il canale attivo non lo restituisce.
prodOrderNotFound=Ordine di produzione {0} non trovato: non \u00e8 nel perimetro configurato, o il canale attivo non lo restituisce.
detailReadFailed=Scheda non caricata: la riga non \u00e8 stata letta ({0}).
plexPlantUnknown=Il plant di questo ciclo non \u00e8 noto: non si pu\u00f2 determinare su quale Plex leggere. Ricarica la pagina.

# -- [PART-ALIVE] Il delta chiede a Plex se la part esiste ancora (feature 0042)
logMatPlexPartsRead=elenco part del tenant letto: {0} part su Plex, {1} coppie con dizionario, {2} da riallineare (la loro part su Plex non c'\u00e8 pi\u00f9)
