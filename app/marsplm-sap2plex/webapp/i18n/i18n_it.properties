# ================================================================
# [COMP-SOURCE] Componente collocato a mano su un'operazione Plex (feature 0036).
# Il tooltip dice cosa FA il marcatore, non solo cosa e': \u00abl'auto-assegnazione non lo sposta\u00bb e'
# l'informazione operativa \u2014 e su un ordine vuol dire anche che l'invio rispetta quell'operazione.
# Dall'11/09/2026 dice il vero anche nel cockpit: `autoAssignConfirmManual` \u2014 la conferma che
# annunciava il ritorno sotto le regole \u2014 e' USCITA con la conversione che dichiarava.
# grep -rn "COMP-SOURCE"
# ================================================================
compManualAssigned=Collocato a mano: l'auto-assegnazione non lo sposta
